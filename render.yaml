services:
  - type: web
    name: hedgefund-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -e .[api]
    startCommand: alembic upgrade head && uvicorn hedgefund.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAPER_TICKER_ENABLED
        value: "0"
